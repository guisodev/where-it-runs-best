name: Actualizar reportes de EmuReady

on:
  schedule:
    - cron: "0 10 * * *"   # todos los días a las 10:00 UTC (07:00 en UTC-3)
  workflow_dispatch:
    inputs:
      full:
        description: "Descarga completa (recoge ediciones y borrados)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-emuready
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar reportes
        working-directory: tools
        run: |
          # El día 1 de cada mes (o si se pide a mano) se hace una descarga completa
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%d)" = "01" ]; then
            node fetch.mjs --full
          else
            node fetch.mjs
          fi

      - name: Descargar FPS y configuraciones (relleno gradual)
        working-directory: tools
        # Hasta 1500 reportes por día, uno cada 2,5 s (~65 min); lo pendiente sigue al día siguiente
        run: node details.mjs --max 1500

      - name: Generar emuready.json, configs.json e index.html
        working-directory: tools
        run: node build.mjs

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          # Solo los datos; index.html se regenera después de traer los cambios de la página
          git add -A tools/data emuready.json configs.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -q -m "Actualizar reportes de EmuReady ($(date -u +%F))"
          # Si alguien subió cambios mientras corría, se integran (en los datos manda esta ejecución)
          for i in 1 2 3; do
            git pull -q --rebase -X theirs && break
            sleep 10
          done
          (cd tools && node build.mjs)
          git add -A emuready.json configs.json index.html
          git diff --cached --quiet || git commit -q --amend --no-edit
          git push
